<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Fond noir abyssal -->
  <rect width="100" height="100" rx="20" fill="#010409" />
  
  <!-- Anneaux du sonar bathymétrique -->
  <circle cx="50" cy="50" r="40" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="3 3"/>
  <circle cx="50" cy="50" r="28" stroke="#0df5c4" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="50" cy="50" r="16" stroke="#00f2fe" stroke-width="2.5" stroke-opacity="0.8"/>
  <circle cx="50" cy="50" r="6" fill="#00f2fe"/>
  
  <!-- Lignes de visée HUD -->
  <line x1="50" y1="10" x2="50" y2="90" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="10" y1="50" x2="90" y2="50" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.3"/>
</svg>
